# ============================================================
# TRACE — Nginx Production Configuration
# Reverse proxy /api/ to Go backend, serve SPA, security headers
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------
    # Gzip Compression
    # ---------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---------------------------------------------------
    # Security Headers
    # ---------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------
    # Reverse Proxy: /api/* → backend:8080/*
    # Strips the /api prefix to match Vite dev proxy behavior:
    #   vite.config.js: rewrite: (path) => path.replace(/^\/api/, '')
    # ---------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------------------------------------------------
    # Hashed Static Assets — Long-Term Immutable Cache
    # Vite generates hashed filenames (e.g., index-abc123.js)
    # ---------------------------------------------------
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Re-apply security headers (add_header in location blocks
        # overrides parent-level add_header directives in Nginx)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------------------------------------------------
    # Nginx Health Endpoint (for container orchestrators)
    # ---------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------
    # SPA Fallback — Client-Side Routing Support
    # All non-file, non-API requests serve index.html
    # ---------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # HTML should not be cached to ensure fresh SPA shell
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
